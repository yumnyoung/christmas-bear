<div class="win">
  <div class="bar"><span><b>art.py</b> · 내 캐릭터 코드 아트</span><span id="clock">t 00.00s</span></div>
  <canvas id="art"></canvas>
  <div class="status"><span id="spin">spin 000.0°&nbsp;&nbsp; built 0%</span><span id="state"></span></div>

<p class="hint"><kbd>Space</kbd> 일시정지 · <kbd>R</kbd> 처음부터 · <kbd>F</kbd> 바로 완성 · 화면 클릭 = 처음부터</p>

<script>
// ───────────────────────── 화면에 타이핑될 코드 (표시용) ─────────────────────────
const CODE = `# art.py — 내 캐릭터 코드 아트
import numpy as np
from term import Canvas, ease

W, H = 100, 50
RAMP = " .:-=+*#%@"
LIGHT = np.array([-.55, .6, -.6])
LIGHT /= np.linalg.norm(LIGHT)

layers = []
def layer(fn):
    layers.append(fn)
    return fn

def spin(p, t, tilt=-.28):
    a = t * .8
    c, s = np.cos(a), np.sin(a)
    x, y, z = p[..., 0], p[..., 1], p[..., 2]
    x, z = x * c - z * s, x * s + z * c
    y, z = (y * np.cos(tilt) - z * np.sin(tilt),
            y * np.sin(tilt) + z * np.cos(tilt))
    return np.stack([x, y, z], -1)

def shade(n, t, k=.12):
    lum = np.clip(spin(n, t) @ LIGHT, 0, 1)
    return k + (1 - k) * lum

@layer
def sky(t, cv):
    # ▶ 밤하늘
    for x, y, ph in STARS:
        tw = .5 + .5 * np.sin(t * 2.5 + ph)
        cv.put(x, y, " .+*"[int(tw * 3.9)])

@layer
def moon(t, cv):
    # ▶ 초승달
    yy, xx = np.mgrid[-1:1:12j, -1:1:24j]
    full = xx**2 + yy**2 < 1
    bite = (xx - .45)**2 + (yy + .25)**2 < .67
    cv.blit(6, 3, full & ~bite, RAMP)

@layer
def snow(t, cv):
    # ▶ 눈송이
    FLAKES[:, 1] += FLAKES[:, 3] * .2
    FLAKES[:, 0] += np.sin(t + FLAKES[:, 2]) * .08
    FLAKES[:, 1] %= H
    cv.scatter(FLAKES, ".*+")

@layer
def ground(t, cv):
    # ▶ 눈 쌓인 바닥
    r, a = np.meshgrid(np.linspace(0, 1.5, 70),
                       np.linspace(0, 2 * np.pi, 380))
    disk = np.stack([r * np.cos(a), np.full_like(r, -.56),
                     r * np.sin(a)], -1)
    cv.solid.append((spin(disk, t), SNOW))

def blob(c, r, n=900):
    # 타원체 표면의 점과 법선
    k = np.arange(n) + .5
    y = 1 - 2 * k / n
    th = k * 2.39996
    u = np.stack([np.sqrt(1 - y * y) * np.cos(th), y,
                  np.sqrt(1 - y * y) * np.sin(th)], -1)
    n = u / r
    return c + u * r, n / np.linalg.norm(n, axis=-1, keepdims=True)

@layer
def body(t, cv):
    # ▶ 앉아 있는 몸
    g = grown("몸")                             # 아래부터 차곡차곡
    parts = [((0, -.27, 0), (.30, .28, .27), FUR),
             ((0, -.30, -.21), (.18, .17, .07), CREAM),   # 배
             ((-.17, -.48, -.26), (.11, .09, .14), FUR),  # 왼발
             ((.17, -.48, -.26), (.11, .09, .14), FUR),   # 오른발
             ((-.29, -.22, -.13), (.09, .14, .09), FUR),  # 왼팔
             ((.29, -.22, -.13), (.09, .14, .09), FUR),   # 오른팔
             ((0, -.42, .25), (.07, .07, .07), FUR)]      # 꼬리
    for c, r, col in parts:
        p, n = blob(np.array(c), np.array(r))
        keep = p[:, 1] < -.58 + .59 * g
        cv.solid.append((spin(p[keep], t), col * shade(n[keep], t)))

@layer
def head(t, cv):
    # ▶ 달걀형 머리와 둥근 곰 귀
    g = grown("머리")
    parts = [((0, .42, 0), (.40, .46, .36), FUR),
             ((-.27, .80, .02), (.14, .14, .07), FUR),    # 왼쪽 귀
             ((.27, .80, .02), (.14, .14, .07), FUR),     # 오른쪽 귀
             ((-.27, .80, -.04), (.085, .085, .025), EAR_IN),
             ((.27, .80, -.04), (.085, .085, .025), EAR_IN),
             ((0, .33, -.32), (.13, .09, .07), CREAM)]    # 주둥이
    for c, r, col in parts:
        p, n = blob(np.array(c), np.array(r))
        keep = p[:, 1] < -.04 + .99 * g
        cv.solid.append((spin(p[keep], t), col * shade(n[keep], t)))

@layer
def face(t, cv):
    # ▶ 동그란 눈, 분홍 코, ω 입, 발바닥
    for k, (c, r, col) in enumerate(FACE):
        s = ease(grown("얼굴") * len(FACE) - k)    # 하나씩 톡톡 생겨요
        if s <= 0:
            continue
        p, n = blob(np.array(c), np.array(r) * s, 120)
        spec = np.clip(spin(n, t) @ HALF, 0, 1) ** 20
        col = col * shade(n, t) + 255 * spec[:, None]   # 반짝 눈망울
        cv.solid.append((spin(p, t), col))

@layer
def scarf(t, cv):
    # ▶ 줄무늬 목도리
    g = grown("목도리")
    u, v = np.meshgrid(np.linspace(0, 2 * np.pi * g, 160),
                       np.linspace(0, 2 * np.pi, 40))
    R = .22 + .06 * np.cos(v)
    ring = np.stack([R * np.cos(u), 0 + .06 * np.sin(v),
                     R * np.sin(u)], -1)
    stripe = np.where((u * 8 / np.pi).astype(int) % 2, RED, GREEN)
    cv.solid.append((spin(ring, t), stripe * shade(ring, t)[..., None]))

def main():
    cv = Canvas(W, H, fps=60)
    for t in cv.clock():
        cv.clear()
        for fn in layers:
            fn(t, cv)
        cv.zbuffer(RAMP)                         # 가까운 점만 남기기
        cv.flush()

if __name__ == "__main__":
    main()
`;

// ───────────────────────── 코드 섹션 → 레이어 매핑 ─────────────────────────
const SECTIONS = {};
(() => {
  const lines = CODE.split('\n');
  let off = 0, last = null;
  const starts = [];
  for (let i = 0; i < lines.length; i++) {
    const m = (lines[i + 1] || '').match(/^def (\w+)\(t, cv\)/);
    if (lines[i].trim() === '@layer' && m) starts.push([m[1], off]);
    if (lines[i].startsWith('def main')) starts.push(['__end', off]);
    off += lines[i].length + 1;
  }
  for (let i = 0; i < starts.length - 1; i++) SECTIONS[starts[i][0]] = [starts[i][1], starts[i + 1][1]];
})();

// ───────────────────────── 유틸 ─────────────────────────
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20261225);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function norm3(x, y, z) { const l = Math.hypot(x, y, z); return [x / l, y / l, z / l]; }

const RAMP = ' .:-=+*#%@';
const RAMP_CODES = [...RAMP].map(c => c.charCodeAt(0));
const COLS = 100, ROWS = 50;
const D = 4, TILT = -0.28, SPIN = 0.8;
const L = norm3(-0.55, 0.6, -0.6);
const HV = norm3(L[0], L[1], L[2] - 1); // 하이라이트용 half vector (시선 = -z)

// ───────────────────────── 재질/색 ─────────────────────────
const M = { FUR: 0, FUR_B: 1, CREAM: 2, GROUND: 3, EAR_IN: 4, RED: 5, GREEN: 6, EYE: 7, BLUSH: 8,
  POM: 9, WHITE: 10, FLASH: 11, SKY: 12, MOON: 13, SNOW: 14, NOSE: 15, BADGE: 16 };
const BASE = [
  [250, 248, 242], [236, 234, 228], [232, 238, 248], [165, 185, 220], [238, 182, 112],
  [232, 52, 64], [44, 172, 88], [20, 20, 26], [255, 128, 146],
  [255, 250, 240], [255, 255, 255], [255, 236, 200], [150, 170, 220], [238, 226, 178], [215, 228, 255],
  [40, 44, 70], [80, 145, 245],
];
const GLOW = new Uint8Array(BASE.length);
[M.POM, M.WHITE, M.FLASH].forEach(m => GLOW[m] = 1);
const COLOR = [];
BASE.forEach(([r, g, b]) => {
  for (let l = 0; l < 10; l++) {
    const f = 0.2 + 0.8 * l / 9;
    const w = l >= 8 ? (l - 7) * 0.06 : 0; // 아주 밝은 칸은 살짝 흰빛
    COLOR.push(`rgb(${Math.min(255, Math.round(r * f + 255 * w))},${Math.min(255, Math.round(g * f + 255 * w))},${Math.min(255, Math.round(b * f + 255 * w))})`);
  }
});

// ───────────────────────── 곰돌이 형상 ─────────────────────────
function makeSet(cap, opts = {}) {
  return Object.assign({ n: 0, x: new Float32Array(cap), y: new Float32Array(cap), z: new Float32Array(cap),
    nx: new Float32Array(cap), ny: new Float32Array(cap), nz: new Float32Array(cap),
    key: new Float32Array(cap), aux: new Float32Array(cap), mat: new Uint8Array(cap), cull: true, fixed: false }, opts);
}
function push(P, x, y, z, nx, ny, nz, key, aux, mat) {
  const i = P.n++;
  P.x[i] = x; P.y[i] = y; P.z[i] = z; P.nx[i] = nx; P.ny[i] = ny; P.nz[i] = nz;
  P.key[i] = key; P.aux[i] = aux; P.mat[i] = mat;
}
function fib(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const y = 1 - 2 * (i + 0.5) / n, rr = Math.sqrt(1 - y * y), th = i * 2.39996;
    out.push([rr * Math.cos(th), y, rr * Math.sin(th)]);
  }
  return out;
}
function ellArea(a, b, c) { const p = 1.6075; return 4 * Math.PI * Math.pow((Math.pow(a * b, p) + Math.pow(a * c, p) + Math.pow(b * c, p)) / 3, 1 / p); }
const DENS = 5200;
function addEllipsoid(P, [cx0, cy0, cz0], [rx, ry, rz], mat, keyFn, furNoise = 0.22) {
  const n = Math.ceil(ellArea(rx, ry, rz) * DENS);
  for (const [ux, uy, uz] of fib(n)) {
    const x = cx0 + ux * rx, y = cy0 + uy * ry, z = cz0 + uz * rz;
    const [nx, ny, nz] = norm3(ux / rx, uy / ry, uz / rz);
    const m = (mat === M.FUR && rnd() < 0.3) ? M.FUR_B : mat;
    push(P, x, y, z, nx, ny, nz, keyFn(x, y, z), (rnd() - 0.5) * furNoise, m);
  }
}
function addTorus(P, [cx0, cy0, cz0], R, r, matFn, keyFn, nu = 220, nv = 48) {
  for (let iu = 0; iu < nu; iu++) for (let iv = 0; iv < nv; iv++) {
    const u = (iu + rnd() * 0.5) / nu * Math.PI * 2, v = (iv + rnd() * 0.5) / nv * Math.PI * 2;
    const cu = Math.cos(u), su = Math.sin(u), cv = Math.cos(v), sv = Math.sin(v);
    push(P, cx0 + (R + r * cv) * cu, cy0 + r * sv, cz0 + (R + r * cv) * su,
      cv * cu, sv, cv * su, keyFn(u, v), (rnd() - 0.5) * 0.15, matFn(u, v));
  }
}

const BODY_Y0 = -0.58, BODY_Y1 = 0.01, HEAD_Y0 = -0.04, HEAD_Y1 = 0.95;
const bodyKey = (x, y) => (y - BODY_Y0) / (BODY_Y1 - BODY_Y0);
const headKey = (x, y) => (y - HEAD_Y0) / (HEAD_Y1 - HEAD_Y0);

// 기울어진 납작 원뿔 (뾰족 귀)
function addCone(P, [bx, by, bz], [tx, ty, tz], R0, flatZ, mat, keyFn) {
  const len = Math.hypot(tx - bx, ty - by, tz - bz);
  const NS = 60, NU = 160;
  for (let is = 0; is < NS; is++) {
    const s = (is + rnd()) / NS, r = R0 * (1 - s);
    const nu = Math.max(8, Math.ceil(NU * (1 - s)));
    for (let iu = 0; iu < nu; iu++) {
      const u = (iu + rnd()) / nu * Math.PI * 2;
      const [nx, ny, nz] = norm3(Math.cos(u), R0 / len, Math.sin(u) / flatZ);
      const x = bx + (tx - bx) * s + r * Math.cos(u), y = by + (ty - by) * s, z = bz + (tz - bz) * s + r * Math.sin(u) * flatZ;
      push(P, x, y, z, nx, ny, nz, keyFn(x, y, z), (rnd() - 0.5) * 0.15, mat);
    }
  }
}

// 앉아 있는 몸
const BODY = makeSet(50000);
addEllipsoid(BODY, [0, -0.27, 0], [0.30, 0.28, 0.27], M.FUR, bodyKey);
addEllipsoid(BODY, [0, -0.30, -0.21], [0.18, 0.17, 0.07], M.CREAM, bodyKey, 0.08);
for (const sx of [-1, 1]) {
  addEllipsoid(BODY, [sx * 0.17, -0.48, -0.26], [0.11, 0.09, 0.14], M.FUR, bodyKey);
  addEllipsoid(BODY, [sx * 0.29, -0.22, -0.13], [0.09, 0.14, 0.09], M.FUR, bodyKey);
}
addEllipsoid(BODY, [0, -0.42, 0.25], [0.07, 0.07, 0.07], M.FUR, bodyKey, 0.12);

// 달걀형 머리 + 뾰족한 귀 + 주둥이
const HEAD = makeSet(50000);
addEllipsoid(HEAD, [0, 0.42, 0], [0.40, 0.46, 0.36], M.FUR, headKey);
for (const sx of [-1, 1]) {
  addEllipsoid(HEAD, [sx * 0.27, 0.80, 0.02], [0.14, 0.14, 0.07], M.FUR, headKey);
  addEllipsoid(HEAD, [sx * 0.27, 0.80, -0.04], [0.085, 0.085, 0.025], M.EAR_IN, headKey, 0.08);
}
addEllipsoid(HEAD, [0, 0.33, -0.32], [0.13, 0.09, 0.07], M.CREAM, headKey, 0.08);

// 얼굴 부품 (하나씩 톡톡 나타남)
const FACE = [
  { c: [-0.17, -0.48, -0.395], r: [0.065, 0.055, 0.02], mat: M.EAR_IN },
  { c: [0.17, -0.48, -0.395], r: [0.065, 0.055, 0.02], mat: M.EAR_IN },
  { c: [-0.27, 0.35, -0.25], r: [0.05, 0.03, 0.02], mat: M.BLUSH },
  { c: [0.27, 0.35, -0.25], r: [0.05, 0.03, 0.02], mat: M.BLUSH },
  { c: [-0.17, 0.45, -0.315], r: [0.046, 0.046, 0.028], mat: M.EYE, shiny: true },
  { c: [0.17, 0.45, -0.315], r: [0.046, 0.046, 0.028], mat: M.EYE, shiny: true },
  { c: [0, 0.355, -0.38], r: [0.036, 0.025, 0.025], mat: M.BLUSH, shiny: true },
  { c: [-0.022, 0.295, -0.378], r: [0.024, 0.01, 0.012], mat: M.NOSE },
  { c: [0.022, 0.295, -0.378], r: [0.024, 0.01, 0.012], mat: M.NOSE },
];
FACE.forEach(f => f.dirs = fib(Math.max(60, Math.ceil(ellArea(...f.r) * DENS * 1.6))));

// 목도리 (도넛 + 늘어진 끝자락)
const SCARF = makeSet(20000);
const stripe = u => Math.floor(u * 8 / Math.PI) % 2 ? M.RED : M.GREEN;
addTorus(SCARF, [0, 0.0, 0], 0.22, 0.06, u => stripe(u), u => u / (Math.PI * 2) * 0.85);
addEllipsoid(SCARF, [0.15, -0.11, -0.215], [0.055, 0.10, 0.028], M.RED, (x, y) => 0.85 + (0.0 - y) / 0.21 * 0.15, 0.1);
for (let i = 0; i < SCARF.n; i++) if (SCARF.key[i] > 0.85) SCARF.mat[i] = Math.floor((SCARF.y[i] + 1) * 22) % 2 ? M.RED : M.GREEN;

// 산타 모자 (기울어진 원뿔 + 털 테두리 + 방울)
const HAT = makeSet(30000);
const HAT_BASE = [0, 0.66, 0.02], HAT_TIP = [0.15, 1.06, 0.12];
(() => {
  const [bx, by, bz] = HAT_BASE, [tx, ty, tz] = HAT_TIP, R0 = 0.33;
  const len = Math.hypot(tx - bx, ty - by, tz - bz);
  const NS = 90, NU = 260;
  for (let is = 0; is < NS; is++) {
    const s = (is + rnd()) / NS, r = R0 * (1 - s);
    const nu = Math.max(8, Math.ceil(NU * (1 - s)));
    for (let iu = 0; iu < nu; iu++) {
      const u = (iu + rnd()) / nu * Math.PI * 2;
      const [nx, ny, nz] = norm3(Math.cos(u), R0 / len, Math.sin(u));
      push(HAT, bx + (tx - bx) * s + r * Math.cos(u), by + (ty - by) * s, bz + (tz - bz) * s + r * Math.sin(u),
        nx, ny, nz, 0.25 + 0.6 * s, (rnd() - 0.5) * 0.15, M.RED);
    }
  }
  addTorus(HAT, HAT_BASE, 0.32, 0.055, () => M.WHITE, u => u / (Math.PI * 2) * 0.25);
  for (let i = 0; i < HAT.n; i++) if (HAT.mat[i] === M.WHITE) HAT.aux[i] -= 0.25; // 털은 살짝 덜 눈부시게
})();
const POM = { c: HAT_TIP, r: [0.075, 0.075, 0.075], mat: M.POM, dirs: fib(260) };

// 바닥 (밝기 고정)
const GROUND = makeSet(30000, { cull: false, fixed: true });
for (let ir = 0; ir < 70; ir++) {
  const r = 1.5 * (ir + rnd()) / 70;
  const na = Math.max(6, Math.ceil(r * 380));
  for (let ia = 0; ia < na; ia++) {
    const a = (ia + rnd()) / na * Math.PI * 2;
    let b = 0.16 + 0.3 * rnd() + (1 - r / 1.5) * 0.22;
    let lvl = clamp(Math.round(b * 9), 1, 5);
    if (rnd() < 0.015) lvl = 7;
    push(GROUND, r * Math.cos(a), -0.56, r * Math.sin(a), 0, 1, 0, r / 1.5, lvl, M.GROUND);
  }
}

// 하늘 별 & 눈송이
const SKY = [];
for (let i = 0; i < 120; i++) SKY.push({ c: Math.floor(rnd() * COLS), r: Math.floor(rnd() * ROWS * 0.72), ph: rnd() * 6.28, sp: 1.5 + rnd() * 2.5 });
const FLAKES = [];
for (let i = 0; i < 150; i++) FLAKES.push({ x: rnd() * COLS, y: rnd() * ROWS, v: 1.6 + rnd() * 3.2, ph: rnd() * 6.28,
  front: rnd() < 0.35, ch: '.·*+'.charCodeAt(Math.floor(rnd() * 4)) });

// ───────────────────────── 캔버스 & 버퍼 ─────────────────────────
const cvs = document.getElementById('art'), ctx = cvs.getContext('2d');
const N = COLS * ROWS;
const zb = new Float32Array(N), chb = new Uint16Array(N), cmb = new Uint16Array(N);
let cw, chh, fontPx, Wpx, Hpx, S, cx, cy;
function resize() {
  const w = cvs.parentElement.clientWidth;
  const dpr = window.devicePixelRatio || 1;
  cw = w / COLS; fontPx = cw / 0.6; chh = fontPx * 1.0;
  Wpx = w; Hpx = Math.round(chh * ROWS);
  cvs.width = Math.round(w * dpr); cvs.height = Math.round(Hpx * dpr);
  cvs.style.width = w + 'px'; cvs.style.height = Hpx + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Hpx * 0.4; cx = w / 2; cy = Hpx * 0.6;
}
window.addEventListener('resize', resize);
resize();

let ca, sa, cp = Math.cos(TILT), sp = Math.sin(TILT);
function plot(px, py, z, code, m, lvl) {
  const c = (px / cw) | 0, r = (py / chh) | 0;
  if (px < 0 || c >= COLS || py < 0 || r >= ROWS) return;
  const i = r * COLS + c;
  if (z < zb[i]) { zb[i] = z; chb[i] = code; cmb[i] = m * 10 + lvl; }
}

// 3D 점 하나를 회전→투영해서 찍기. 법선도 같이 돌려 밝기를 계산
function drawSet(P, g, flash) {
  for (let i = 0; i < P.n; i++) {
    const key = P.key[i];
    if (key > g) continue;
    const nx = P.nx[i], ny = P.ny[i], nz = P.nz[i];
    const nx1 = nx * ca - nz * sa, nz1 = nx * sa + nz * ca;
    const ny2 = ny * cp - nz1 * sp, nz2 = ny * sp + nz1 * cp;
    if (P.cull && nz2 > 0.3) continue;
    const x = P.x[i], y = P.y[i], z = P.z[i];
    const x1 = x * ca - z * sa, z1 = x * sa + z * ca;
    const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
    const f = D / (D + z2);
    let lvl, m = P.mat[i];
    if (P.fixed) lvl = P.aux[i];
    else {
      const d = nx1 * L[0] + ny2 * L[1] + nz2 * L[2];
      lvl = clamp(Math.round((0.12 + 0.88 * Math.max(0, d) + P.aux[i]) * 9), 1, 9);
    }
    if (flash && g < 1 && g - key < 0.02) { m = M.FLASH; lvl = 9; }
    plot(cx + x1 * S * f, cy - y2 * S * f, z2, RAMP_CODES[lvl], m, lvl);
  }
}

function rot(x, y, z) {
  const x1 = x * ca - z * sa, z1 = x * sa + z * ca;
  return [x1, y * cp - z1 * sp, y * sp + z1 * cp];
}

// 작은 부품 하나를 크기 s로 그리기 (눈, 코, 볼터치, 방울)
function drawPart(f, s) {
  if (s <= 0.001) return;
  const [cx0, cy0, cz0] = f.c, [rx, ry, rz] = f.r;
  for (const [ux, uy, uz] of f.dirs) {
    const [n0, n1, n2] = norm3(ux / rx, uy / ry, uz / rz);
    const [nx, ny, nz] = rot(n0, n1, n2);
    if (nz > 0.25) continue;
    const [x, y, z] = rot(cx0 + ux * rx * s, cy0 + uy * ry * s, cz0 + uz * rz * s);
    const f2 = D / (D + z);
    const px = cx + x * S * f2, py = cy - y * S * f2;
    const spec = f.shiny ? Math.pow(Math.max(0, nx * HV[0] + ny * HV[1] + nz * HV[2]), 24) : 0;
    if (spec > 0.5) { plot(px, py, z - 0.01, 64, M.WHITE, 9); continue; }
    const d = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
    const lvl = clamp(Math.round((0.3 + 0.7 * d) * 9), f.mat === M.EYE ? 7 : 2, 9);
    plot(px, py, z - 0.01, RAMP_CODES[lvl], f.mat, lvl);
  }
}

const BADGE = [];
(() => {
  const poly = [];
  for (let k = 0; k < 10; k++) { const rad = k % 2 ? 0.03 : 0.07, th = k * Math.PI / 5 + Math.PI / 2; poly.push([rad * Math.cos(th), rad * Math.sin(th)]); }
  const inside = (x, y) => { let c = false; for (let i = 0, j = 9; i < 10; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
  for (let u = -0.075; u <= 0.075; u += 0.003) for (let v = -0.075; v <= 0.075; v += 0.003) if (inside(u, v)) BADGE.push([u, v, Math.hypot(u, v)]);
})();
// 가슴의 노란 별 배지
function drawBadge(s, t) {
  if (s <= 0.001) return;
  const [, , nz] = rot(0, 0.25, -1);
  if (nz > 0.1) return;
  const pulse = 0.85 + 0.15 * Math.sin(t * 5);
  for (const [u, v, d] of BADGE) {
    const [x, y, z] = rot(u * s, -0.12 + v * s, -0.245 - v * s * 0.25);
    const f = D / (D + z);
    const lvl = clamp(Math.round((0.55 + 0.45 * Math.abs(nz)) * pulse * 9 + (d < 0.025 ? 2 : 0)), 5, 9);
    plot(cx + x * S * f, cy - y * S * f, z - 0.02, RAMP_CODES[lvl], M.BADGE, lvl);
  }
}
function drawFace(g, t) {
  const gk = g * FACE.length;
  FACE.forEach((f, k) => drawPart(f, easeOutBack(clamp(gk - k, 0, 1))));
}

function drawMoon(p) {
  if (p <= 0) return;
  const R = 5.2 * chh, mx = 14 * cw, my = 8 * chh;
  const bx = mx + 0.45 * R, by = my - 0.25 * R, bR = 0.82 * R;
  const r0 = Math.floor((my - R) / chh), r1 = Math.ceil((my + R) / chh);
  const rMax = r0 + (r1 - r0) * p;
  for (let r = Math.max(0, r0); r <= r1 && r <= rMax; r++) for (let c = 0; c < 32; c++) {
    const px = (c + 0.5) * cw, py = (r + 0.5) * chh;
    if (Math.hypot(px - mx, py - my) > R) continue;
    const db = Math.hypot(px - bx, py - by) - bR;
    if (db < 0) continue;
    const lvl = clamp(Math.round(3 + db / R * 16), 2, 9);
    const i = r * COLS + c;
    if (zb[i] > 1e6) { zb[i] = 1e6; chb[i] = RAMP_CODES[lvl]; cmb[i] = M.MOON * 10 + lvl; }
  }
}

function drawSky(p, t) {
  const n = Math.floor(SKY.length * p);
  for (let k = 0; k < n; k++) {
    const s = SKY[k], tw = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
    const idx = Math.floor(tw * 3.9);
    if (idx === 0) continue;
    const i = s.r * COLS + s.c;
    if (zb[i] > 1e7) { zb[i] = 1e7; chb[i] = ' .+*'.charCodeAt(idx); cmb[i] = M.SKY * 10 + 3 + idx * 2; }
  }
}

function drawSnow(p, t, dt) {
  const n = Math.floor(FLAKES.length * p);
  for (let k = 0; k < FLAKES.length; k++) {
    const f = FLAKES[k];
    f.y += f.v * dt; f.x += Math.sin(t * 0.8 + f.ph) * 0.6 * dt;
    if (f.y >= ROWS) { f.y -= ROWS; f.x = rnd() * COLS; }
    if (k >= n) continue;
    const c = ((f.x % COLS) + COLS) % COLS | 0, r = f.y | 0;
    const i = r * COLS + c;
    if (f.front) { zb[i] = -1e9; chb[i] = f.ch; cmb[i] = M.SNOW * 10 + 9; }
    else if (zb[i] > 1e7) { zb[i] = 1e7; chb[i] = f.ch; cmb[i] = M.SNOW * 10 + 5; }
  }
}

const CHAR_CACHE = {};
const chr = code => CHAR_CACHE[code] || (CHAR_CACHE[code] = String.fromCharCode(code));

function flush() {
  ctx.fillStyle = '#05070b';
  ctx.fillRect(0, 0, Wpx, Hpx);
  ctx.font = `${fontPx.toFixed(2)}px "Cascadia Mono", Consolas, "Courier New", monospace`;
  ctx.textBaseline = 'top';
  ctx.shadowBlur = 0;
  let lastCol = -1;
  for (let i = 0; i < N; i++) {
    if (zb[i] === Infinity) continue;
    const cm = cmb[i];
    if (cm !== lastCol) { ctx.fillStyle = COLOR[cm]; lastCol = cm; }
    ctx.fillText(chr(chb[i]), (i % COLS) * cw, ((i / COLS) | 0) * chh);
  }
  // 빛나는 칸만 한 번 더 (글로우)
  ctx.shadowBlur = fontPx * 0.9;
  for (let i = 0; i < N; i++) {
    if (zb[i] === Infinity) continue;
    const cm = cmb[i], m = (cm / 10) | 0;
    if (!GLOW[m] || cm % 10 < 8) continue;
    ctx.fillStyle = ctx.shadowColor = COLOR[cm];
    ctx.fillText(chr(chb[i]), (i % COLS) * cw, ((i / COLS) | 0) * chh);
  }
  ctx.shadowBlur = 0;
}

// ───────────────────────── 코드 에디터 ─────────────────────────
const codeEl = document.getElementById('code');
const TOK = /(#.*$)|("[^"]*"?)|(@\w+)|\b(def|for|in|if|else|return|import|from|as|while|continue|and|or|not|lambda|None|True|False)\b|(\b\d+\.?\d*|\.\d+)|([A-Za-z_]\w*)(?=\()/g;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function highlight(line) {
  let out = '', last = 0, m;
  TOK.lastIndex = 0;
  while ((m = TOK.exec(line))) {
    out += esc(line.slice(last, m.index));
    const cls = m[1] ? (m[1].startsWith('# ▶') ? 'sec' : 'cm') : m[2] ? 'st' : m[3] ? 'de' : m[4] ? 'kw' : m[5] ? 'nu' : 'fn';
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
    if (m[0].length === 0) TOK.lastIndex++;
  }
  return out + esc(line.slice(last));
}
const VIS = 14;
let lastRendered = -1;
function renderCode(n, force) {
  if (n === lastRendered && !force) return;
  lastRendered = n;
  const lines = CODE.slice(0, n).split('\n');
  const cur = lines.length - 1;
  const from = Math.max(0, cur - VIS + 2);
  let html = '';
  for (let i = from; i <= cur; i++) {
    html += `<div class="l${i === cur ? ' cur' : ''}"><span class="no">${i + 1}</span>${highlight(lines[i])}${i === cur ? '<span class="caret"></span>' : ''}</div>`;
  }
  codeEl.innerHTML = html;
  document.getElementById('ln').textContent = `Ln ${cur + 1}`;
}

// ───────────────────────── 메인 루프 ─────────────────────────
const CPS = 165;            // 초당 타이핑 글자 수 (공백 제외)
const HOLD = 12;            // 완성 후 감상 시간(초)
let typed = 0, budget = 0, paused = false, doneFor = 0, clock = 0, fps = 60, prev = performance.now();
const prog = name => { const s = SECTIONS[name]; return s ? clamp((typed - s[0]) / (s[1] - s[0]), 0, 1) : 0; };
function restart() { typed = 0; budget = 0; doneFor = 0; clock = 0; lastRendered = -1; }

const spinEl = document.getElementById('spin'), clockEl = document.getElementById('clock'),
  runEl = document.getElementById('run'), stateEl = document.getElementById('state');

function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  fps += (1 / Math.max(dt, 1e-3) - fps) * 0.05;
  if (!paused) {
    clock += dt;
    if (typed < CODE.length) {
      budget += dt * CPS;
      while (budget >= 1 && typed < CODE.length) {
        const c = CODE[typed++];
        if (c !== ' ' && c !== '\n') budget--;
      }
    } else if ((doneFor += dt) > HOLD) restart();
  }
  const ang = clock * SPIN;
  ca = Math.cos(ang); sa = Math.sin(ang);

  zb.fill(Infinity);
  drawSet(GROUND, prog('ground'), false);
  drawSet(BODY, prog('body'), true);
  drawSet(HEAD, prog('head'), true);
  drawFace(prog('face'), clock);
  drawSet(SCARF, prog('scarf'), true);
  drawMoon(prog('moon'));
  drawSky(prog('sky'), clock);
  drawSnow(prog('snow'), clock, paused ? 0 : dt);
  flush();

  renderCode(typed);
  const built = Math.round(typed / CODE.length * 100);
  const deg = ((ang * 180 / Math.PI) % 360).toFixed(1).padStart(5, '0');
  spinEl.innerHTML = `spin ${deg}°&nbsp;&nbsp; built ${built}%`;
  clockEl.textContent = `t ${clock.toFixed(2).padStart(5, '0')}s`;
  runEl.innerHTML = paused ? '<i style="color:#d29922">●</i> paused' : `<i>●</i> running · ${Math.round(fps)} fps`;
  stateEl.textContent = typed >= CODE.length ? '✓ 완성! 메리 크리스마스 🎄' : '';
  requestAnimationFrame(frame);
}

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R') restart();
  else if (e.key === 'f' || e.key === 'F') { typed = CODE.length; doneFor = 0; }
});
cvs.addEventListener('click', restart);
requestAnimationFrame(frame);
</script>
</body>
</html>
